# Dependabot keeps the workflow's pinned actions current, as pull requests
# to develop like any other change. Vulnerable npm packages are raised as
# Dependabot alerts on the repository's Security tab.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
