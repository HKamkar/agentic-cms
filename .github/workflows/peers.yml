# The package's peer ranges, tested at both ends (docs/stability.md
# § Peers): the pack smoke's site, laid out from the tarball, built, linted
# and tested at the floor — each peer at the lowest version its range
# allows, on the Node floor package.json's engines names — and at the
# newest version within each range, on .nvmrc's Node (tools/pack-smoke.mjs
# --peers). It runs on a pull request that changes package.json, on pushes
# to main, and weekly, which finds a new minor of a peer that breaks the kit
# before a site does. The token reads the repository and nothing else,
# checkout keeps no credential in .git/config, and every action is pinned to
# a commit (.github/dependabot.yml proposes the updates).
name: peers
on:
  pull_request:
    paths: [package.json]
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  peers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - end: floor
            node: "22.18"
          - end: newest
            node-file: .nvmrc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          node-version-file: ${{ matrix.node-file }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:pack --peers ${{ matrix.end }}
