# What every pull request and every push to develop or main must pass: the
# verify block (lint, the unit suites, the build with its content lint and
# SEO audit), the repo's hygiene, and the browser suite with Chromium and
# WebKit installed for it (the lab timeline's cases run in both). The pack
# smoke (a scratch site built from the tarball, minutes) runs on pushes to
# main; the preview (at the end) on pull requests, once the owner opts in.
# The token reads the repository and nothing else (the preview job also
# writes its one comment on the pull request), checkout keeps no
# credential in .git/config (and the test job fetches the history and the
# tags, which the hygiene's record of the agent files at every release is
# checked against), and every action is pinned to a commit
# (.github/dependabot.yml proposes the updates).
name: verify
on:
  pull_request:
  push:
    branches: [develop, main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm hygiene
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright-core install --with-deps chromium webkit
      - run: pnpm test:browser
  pack:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:pack
  # A preview of every pull request (docs/preview.md), the example site as
  # the site template's job makes one, opt-in: the repository variable
  # AGENTIC_CMS_PREVIEW set to "cloudflare", and the owner's secrets
  # CLOUDFLARE_API_TOKEN (Workers Scripts: Edit) and CLOUDFLARE_ACCOUNT_ID.
  # pr-preview builds the example as
  # production with AGENTIC_CMS_PREVIEW=1 (every page noindex, forms
  # delivered to a log, no analytics tag), uploads it as a Workers version
  # under the alias pr-<number>, not deployed, and keeps one comment on the
  # pull request: the link, the same on every push, and the pages the change
  # touches (the history, for the diff against the base branch). A pull
  # request from a fork has no secrets: its run says it made no preview.
  preview:
    if: github.event_name == 'pull_request' && vars.AGENTIC_CMS_PREVIEW == 'cloudflare'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm kit pr-preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          GOOGLE_TAG_ID: ""
