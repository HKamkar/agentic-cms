# Publishes a version of agentic-cms to npm from a pushed v* tag
# (docs/releasing.md), in three jobs, its logic in tools/release.mjs.
#   check: the tag names package.json's version, a release sits on main
#     with its CHANGELOG.md section and a candidate on develop; then the
#     verify block, the hygiene, the pack smoke, which keeps the tarball it
#     built a site from, and the package's lint on that tarball, which goes
#     up as the run's artifact beside its sha512.
#   publish: in the environment npm, which waits for the owner's approval,
#     with an OIDC token for npm's trusted publishing and no other secret.
#     It installs nothing and restores no cache, so nothing a cache holds
#     reaches it: the artifact's sha512 checked, npm and Node at trusted
#     publishing's floors, then npm publish to latest (a release) or next (a
#     candidate), with the provenance trusted publishing attaches; nothing,
#     when the registry holds this same tarball already (a package's first
#     version goes up by hand, from this artifact).
#   after: the GitHub Release with the tarball, a candidate marked a
#     prerelease; a site laid out from the registry, the kit installed with
#     no build approval, then its build, lint and tests; npm audit
#     signatures over an install of the version.
# Started by hand (workflow_dispatch) it is the dry run: check in full, then
# npm publish --dry-run outside the environment and with no token; nothing
# else. Every action is pinned to a commit (.github/dependabot.yml proposes
# the updates) and checkout keeps no credential in .git/config.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.release.outputs.name }}
      version: ${{ steps.release.outputs.version }}
      dist-tag: ${{ steps.release.outputs.dist-tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      node: ${{ steps.release.outputs.node }}
      tarball: ${{ steps.release.outputs.tarball }}
      integrity: ${{ steps.tarball.outputs.integrity }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - id: release
        run: node tools/release.mjs check ${TAG:+--tag "$TAG"}
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm hygiene
      - run: pnpm test:pack --keep "$RUNNER_TEMP/release"
      - run: pnpm lint:pkg --tarball "$RUNNER_TEMP/release/$TARBALL"
        env:
          TARBALL: ${{ steps.release.outputs.tarball }}
      - id: tarball
        run: |
          sri=$(node tools/release.mjs integrity "$RUNNER_TEMP/release/$TARBALL")
          echo "$sri" > "$RUNNER_TEMP/release/$TARBALL.sha512"
          echo "integrity=$sri" >> "$GITHUB_OUTPUT"
        env:
          TARBALL: ${{ steps.release.outputs.tarball }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.release.outputs.name }}-${{ steps.release.outputs.version }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
  publish:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.check.outputs.node }}
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.check.outputs.name }}-${{ needs.check.outputs.version }}
          path: ${{ runner.temp }}/release
      - run: node tools/release.mjs publish "$RUNNER_TEMP/release/$TARBALL" --integrity "$INTEGRITY" --tag "$DIST_TAG"
        env:
          TARBALL: ${{ needs.check.outputs.tarball }}
          INTEGRITY: ${{ needs.check.outputs.integrity }}
          DIST_TAG: ${{ needs.check.outputs.dist-tag }}
  dry-run:
    if: github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.check.outputs.node }}
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.check.outputs.name }}-${{ needs.check.outputs.version }}
          path: ${{ runner.temp }}/release
      - run: node tools/release.mjs publish "$RUNNER_TEMP/release/$TARBALL" --integrity "$INTEGRITY" --tag "$DIST_TAG" --dry-run
        env:
          TARBALL: ${{ needs.check.outputs.tarball }}
          INTEGRITY: ${{ needs.check.outputs.integrity }}
          DIST_TAG: ${{ needs.check.outputs.dist-tag }}
  after:
    if: github.event_name == 'push'
    needs: [check, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.check.outputs.name }}-${{ needs.check.outputs.version }}
          path: ${{ runner.temp }}/release
      - name: the GitHub Release
        run: |
          node tools/release.mjs notes "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/release/$TARBALL" "$RUNNER_TEMP/release/$TARBALL.sha512" \
              --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" ${PRERELEASE:+--prerelease}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          TARBALL: ${{ needs.check.outputs.tarball }}
          PRERELEASE: ${{ needs.check.outputs.prerelease == 'true' && '1' || '' }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: node tools/release.mjs wait "$NAME@$VERSION"
        env:
          NAME: ${{ needs.check.outputs.name }}
          VERSION: ${{ needs.check.outputs.version }}
      - run: node tools/release.mjs smoke "$VERSION"
        env:
          VERSION: ${{ needs.check.outputs.version }}
      - run: node tools/release.mjs audit "$VERSION"
        env:
          VERSION: ${{ needs.check.outputs.version }}
