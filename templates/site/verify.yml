# What every pull request and every push to develop or main must pass: the
# lint, the unit tests, the build (the content lint, next build and the SEO
# audit), and the agent files against the kit's — a rule or skill the kit
# has updated since (stale), one that is missing, or one the site edited
# (modified) fails that step (node_modules/agentic-cms/docs/init.md). pnpm
# comes from package.json's packageManager, Node from .nvmrc (Node 25 and
# later ship no corepack). The token reads the repository and nothing else,
# checkout keeps no credential in .git/config, and every action is pinned to
# a commit: update a pin by its sha, never by a moving tag.
name: verify
on:
  pull_request:
  push:
    branches: [develop, main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      # The starter's placeholder copy warns here and fails every other
      # production build, a deploy's included: this run deploys nothing, so a
      # new site is green before its copy is written (docs/init.md).
      - run: pnpm build
        env:
          AGENTIC_CMS_PLACEHOLDERS: warn
      - run: pnpm exec agentic-cms init . --agent-files --check
