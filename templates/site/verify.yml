# What every pull request and every push to develop or main must pass: the
# lint (ESLint, then agentic-cms check-site, which lists every exception
# added since the pull request's base branch — the checkout takes the
# history for it), the unit tests, the build (the lint again, the content
# lint, the docs check, next build, the SEO audit and, while site.ts says
# guardEmail: true, the e-mail guard), and the agent files against the
# kit's — a rule or skill the kit has updated since (stale), one
# that is missing, or an edit that dropped a line the kit marks required
# fails that step (node_modules/agentic-cms/docs/init.md). pnpm comes from
# package.json's packageManager, Node from .nvmrc (Node 25 and later ship no
# corepack). The token reads the repository and nothing else (the opt-in
# preview job, at the end, also writes its one comment on the pull
# request), checkout keeps
# no credential in .git/config, and every action is pinned to a commit
# (.github/dependabot.yml proposes the updates): update a pin by its sha,
# never by a moving tag.
name: verify
on:
  pull_request:
  push:
    branches: [develop, main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      # The starter's placeholder copy warns here and fails every other
      # production build, a deploy's included: this run deploys nothing, so a
      # new site is green before its copy is written (docs/init.md).
      - run: pnpm build
        env:
          AGENTIC_CMS_PLACEHOLDERS: warn
      - run: pnpm exec agentic-cms init . --agent-files --check
  # A preview of every pull request
  # (node_modules/agentic-cms/docs/preview.md), opt-in for a site on
  # Cloudflare Workers: the repository variable AGENTIC_CMS_PREVIEW set to
  # "cloudflare", and the secrets CLOUDFLARE_API_TOKEN (Workers Scripts:
  # Edit) and CLOUDFLARE_ACCOUNT_ID. agentic-cms pr-preview builds the site
  # as production with AGENTIC_CMS_PREVIEW=1 (every page noindex, forms
  # delivered to a log, no analytics tag), uploads it as a Workers version
  # under the alias pr-<number>, not deployed, and keeps one comment on the
  # pull request: the link, the same on every push, and the pages the change
  # touches (the history, for the diff against the base branch). A pull
  # request from a fork has no secrets: its run says it made no preview.
  preview:
    if: github.event_name == 'pull_request' && vars.AGENTIC_CMS_PREVIEW == 'cloudflare'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec agentic-cms pr-preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          GOOGLE_TAG_ID: ""
