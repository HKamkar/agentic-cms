  <text x="640" y="367" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#f2f2f2" xml:space="preserve">every page prerendered</text>
  <rect x="918" y="224" width="246" height="156" fill="#121212" stroke="#f2f2f2" stroke-width="1"/>
