  <text x="52" y="367" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#f2f2f2" xml:space="preserve">stops at every gate</text>
  <rect x="330" y="224" width="246" height="156" fill="#121212" stroke="#f2f2f2" stroke-width="1"/>
  <rect x="346" y="240" width="83.2" height="22" fill="#2a2a2a" stroke="#f2f2f2" stroke-width="1"/>
