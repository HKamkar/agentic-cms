  <rect x="1016" y="16" width="168" height="94" fill="#2a2a2a" stroke="#f2f2f2" stroke-width="1"/>
  <line x1="1016" y1="16" x2="1184" y2="110" stroke="#f2f2f2" stroke-width="1"/>
  <line x1="1184" y1="16" x2="1016" y2="110" stroke="#f2f2f2" stroke-width="1"/>
  <text x="1022" y="31" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#9a9a9a">illustration</text>
  <text x="36" y="118" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="700" letter-spacing="-1.5" fill="#f2f2f2">agentic-cms</text>
  <text x="36" y="166" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#f2f2f2">A simple CMS whose editor is an AI agent.</text>
  <rect x="36" y="224" width="246" height="156" fill="#121212" stroke="#f2f2f2" stroke-width="1"/>
  <rect x="52" y="240" width="66.4" height="22" fill="#2a2a2a" stroke="#f2f2f2" stroke-width="1"/>
  <text x="60" y="255.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#f2f2f2">editor</text>
  <text x="52" y="292" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#f2f2f2" xml:space="preserve">an AI agent</text>
  <text x="52" y="317" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#f2f2f2" xml:space="preserve">/editorial:write-post</text>
