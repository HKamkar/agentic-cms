  <text x="346" y="292" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#f2f2f2" xml:space="preserve">pages/home.yaml</text>
  <text x="346" y="317" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#f2f2f2" xml:space="preserve">blog/&lt;slug>.md</text>
