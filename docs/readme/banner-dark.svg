<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t d">
  <title id="t">agentic-cms</title>
  <desc id="d">An AI agent edits the content files; pnpm build checks the schema, the voice and the SEO; the site ships prerendered with no request-time reads.</desc>
